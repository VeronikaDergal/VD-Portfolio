<script>
/* ─── Analytics bootstrap ───────────────────────────────────────────────
   Nothing loads unless we are on the live site, so local development and
   preview servers never reach Amplitude or Cloudflare.
   Visiting ?me=1 once marks this browser as internal traffic; every event
   from it then carries traffic_type:"internal" so it can be filtered out.
   ?me=0 clears the flag.                                             ── */
(function () {
  var PROD_HOST   = 'veronikadergal.github.io';
  var AMP_KEY     = '822ea7caff0876e6101bd3b12418c6a1';
  var CF_TOKEN    = '1013d7773edf46438460af3f7cc012cf';

  window.vdTrack = function () {};           /* no-op off production */
  if (location.hostname !== PROD_HOST) return;

  var internal = false;
  try {
    var flag = new URLSearchParams(location.search).get('me');
    if (flag === '1') localStorage.setItem('vd_internal', '1');
    if (flag === '0') localStorage.removeItem('vd_internal');
    internal = localStorage.getItem('vd_internal') === '1';
  } catch (e) {}
  var trafficType = internal ? 'internal' : 'external';

  var amp = document.createElement('script');
  amp.src = 'https://cdn.amplitude.com/script/' + AMP_KEY + '.js';
  amp.onload = function () {
    try {
      window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
      window.amplitude.init(AMP_KEY, {
        fetchRemoteConfig: true,
        autocapture: {
          attribution: true, fileDownloads: true, formInteractions: true,
          pageViews: true, sessions: true, elementInteractions: true,
          networkTracking: true, webVitals: true,
          frustrationInteractions: {
            thrashedCursor: true, errorClicks: true,
            deadClicks: true, rageClicks: true
          }
        }
      });
      var ident = new window.amplitude.Identify();
      ident.set('traffic_type', trafficType);
      window.amplitude.identify(ident);

      window.vdTrack = function (name, props) {
        try {
          var payload = { traffic_type: trafficType };
          for (var k in (props || {})) payload[k] = props[k];
          window.amplitude.track(name, payload);
        } catch (e) {}
      };
      (window.vdQueue || []).forEach(function (a) { window.vdTrack(a[0], a[1]); });
      window.vdQueue = [];
    } catch (e) {}
  };
  document.head.appendChild(amp);

  /* queue events fired before Amplitude finishes loading */
  window.vdQueue = [];
  window.vdTrack = function (name, props) { window.vdQueue.push([name, props]); };

  var cf = document.createElement('script');
  cf.defer = true;
  cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  cf.setAttribute('data-cf-beacon', '{"token": "' + CF_TOKEN + '"}');
  document.head.appendChild(cf);
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── Analytics helper — no-ops anywhere the bootstrap didn't run ─── */
const track = (name, props) => {
  try { if (window.vdTrack) window.vdTrack(name, props || {}); } catch (e) {}
};

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    // If the element is already in (or above) the viewport on mount,
    // never hide it — just mark visible immediately, no animation needed.
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight - 20) {
      el.classList.add('visible');
      return;
    }

    // Element is below the fold — hide it and animate it in on scroll.
    el.classList.add('reveal-pending');

    const show = () => {
      el.classList.remove('reveal-pending');
      el.classList.add('visible');
      obs.disconnect();
      clearTimeout(fb);
    };
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) show(); },
      { rootMargin: '0px 0px -20px 0px', threshold: 0 }
    );
    const fb = setTimeout(show, 800); // safety net
    obs.observe(el);
    return () => { obs.disconnect(); clearTimeout(fb); };
  }, []);
  return ref;
}

/* ─── Lights switch ─── */
function LightsSwitch() {
  const [dark, setDark] = useState(() => document.documentElement.classList.contains('dark'));
  const flip = () => {
    const root = document.documentElement;
    const next = !dark;
    root.classList.add('theme-anim');
    root.classList.toggle('dark', next);
    setDark(next);
    try { localStorage.setItem('vd_theme', next ? 'dark' : 'light'); } catch (e) {}
    track('theme_switched', { theme: next ? 'dark' : 'light' });
    setTimeout(() => root.classList.remove('theme-anim'), 700);
  };
  return (
    <button type="button" className="lights" onClick={flip} aria-pressed={dark}
      aria-label={dark ? 'Switch to light mode' : 'Switch to dark mode'}>
      <i aria-hidden="true" />{dark ? 'Lights on' : 'Lights off'}
    </button>
  );
}

/* ─── Nav ─── */
function Nav() {
  const links = [
    { key: 'work',  label: 'Work',  href: '#work'  },
    { key: 'about', label: 'About', href: '#about' },
  ];
  /* Work = everything above About (hero + case studies), About = the rest */
  const [active, setActive] = useState('work');
  useEffect(() => {
    const on = () => {
      const a = document.getElementById('about');
      if (a) setActive(a.getBoundingClientRect().top < window.innerHeight * 0.45 ? 'about' : 'work');
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    window.addEventListener('resize', on);
    return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };
  }, []);
  const idx = links.findIndex(l => l.key === active);
  return (
    <nav className="fixed top-4 inset-x-0 z-50 flex justify-center px-4">
      <div className="glass rounded-full shadow-[0_8px_40px_-8px_rgba(3,105,161,0.14)] p-1.5">
        <ul className="relative grid grid-cols-2">
          <span className="nav-ind" aria-hidden="true" style={{transform:`translateX(${idx * 100}%)`}} />
          {links.map(l => (
            <li key={l.key} className="relative">
              <a href={l.href} aria-current={active === l.key ? 'true' : undefined}
                className={'block text-center px-6 py-2 text-[15px] font-semibold transition-colors duration-300 ' + (active === l.key ? 'text-[#292524]' : 'text-[#57534e] hover:text-[#292524]')}>
                {l.label}
              </a>
            </li>
          ))}
        </ul>
      </div>
    </nav>
  );
}

/* ─── Hero ─── */
function Hero() {
  /* one set of facts, one icon each — stacked beside the photo on desktop,
     wrapped onto a row above the CTAs on narrow screens */
  const FACTS = [
    { icon:<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></>,
      label:'London, UK' },
    { icon:<><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/></>,
      label:'BA International Business Management, University of Lincoln, UK' },
    { icon:<><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 000 18 14 14 0 000-18z"/></>,
      label:'Languages: English, Ukrainian' },

const PILL_NEUTRAL = { background:'rgba(87,83,78,0.07)', color:'#57534e', border:'1px solid rgba(41,37,36,0.08)' };

/* ─── Modal — centered panel with clickable side backdrop ─── */
function Modal({ open, onClose, title, tint, children }) {
  useEffect(() => {
    if (!open) return;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, [open, onClose]);

  if (!open) return null;

  const modal = (
    /* full-screen wrapper — clicking the backdrop (this element) closes */
    <div
      onClick={onClose}
      className={'modal-backdrop ' + (tint ? 'tint-' + tint : '')}
      style={{
        position:'fixed', top:0, left:0, right:0, bottom:0,
        zIndex:9999,
        display:'flex', alignItems:'flex-start', justifyContent:'center',
        background:'rgba(247,246,244,0.9)',
        backdropFilter:'blur(6px)',
        WebkitBackdropFilter:'blur(6px)',
        color:'#292524',
        animation:'fadeIn 0.2s ease both',
        overflowY:'auto',
        padding:'40px 0 80px',
      }}
    >
      {/* the actual panel — stop clicks from bubbling to backdrop */}
      <div
        onClick={e => e.stopPropagation()}
        className={'modal-panel ' + (tint ? 'tint-' + tint : '')}
        style={{
          width:'min(780px, 76vw)',
          flexShrink:0,
          background:'#ffffff',
          borderRadius:'2rem',
          border:'1px solid rgba(41,37,36,0.07)',
          boxShadow:'0 24px 80px -16px rgba(0,0,0,0.16), 0 4px 16px rgba(0,0,0,0.06)',
          overflow:'hidden',
          animation:'slideUp 0.3s cubic-bezier(0.22,1,0.36,1) both',
        }}
      >
        {/* sticky header */}
        <div className={'modal-head ' + (tint ? 'tint-' + tint : '')} style={{
          position:'sticky', top:0,
          background:'rgba(255,255,255,0.97)',
          backdropFilter:'blur(20px)',
          WebkitBackdropFilter:'blur(20px)',
          borderBottom:'1px solid rgba(41,37,36,0.07)',
          padding:'12px 24px',
          display:'flex', alignItems:'center', justifyContent:'space-between',
          zIndex:2,
        }}>
          <span style={{fontSize:10,fontWeight:800,letterSpacing:'0.2em',textTransform:'uppercase',color:'#57534e',opacity:0.5}}>
            {title || 'Case Study'}
          </span>
          <button
            onClick={onClose}
            aria-label="Close"
            style={{
              width:36, height:36, borderRadius:'50%', border:'none', cursor:'pointer',
              background:'rgba(3,105,161,0.08)', color:'#0369a1',
              display:'flex', alignItems:'center', justifyContent:'center',
            }}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        {/* content */}
        <div style={{padding:'36px 40px 60px'}}>
          {children}
        </div>
      </div>
    </div>
  );

  return ReactDOM.createPortal(modal, document.body);
}

/* ─── useInView — fires once when element enters viewport ─── */
function useInView(threshold = 0.3) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

  const bind = i => ({
    onPointerEnter: e => { if (isMouse(e)) setActive(i); },
    onPointerLeave: e => { if (isMouse(e)) setActive(null); },

        </div>

        {/* My Time — ring beside its legend, one card, full width */}
        <div ref={chartRef} className="reveal glass rounded-[2rem] overflow-hidden p-7 sm:p-9"
          style={{boxShadow:'0 2px 16px rgba(0,0,0,0.07)'}}>
          <div className="grid md:grid-cols-[236px_1fr] gap-8 md:gap-10 items-center">

            <div className="flex justify-center" ref={donutRef}>
              <svg viewBox={`0 0 ${VB} ${VB}`} role="img" aria-label={ariaLabel}
                style={{width:'100%', maxWidth:236, height:'auto', overflow:'visible'}}>
                {slices.map(s => (
                  <circle key={s.i} cx={CX} cy={CX} r={R} fill="none"
                    stroke={s.fill}
                    strokeWidth={active === s.i ? SW + 6 : SW}
                    strokeDasharray={`${s.len} ${C}`}
                    strokeDashoffset={donutVisible ? 0 : s.len}
                    transform={`rotate(${s.start}, ${CX}, ${CX})`}
                    style={{
                      transition:`stroke-dashoffset 1s cubic-bezier(0.22,1,0.36,1) ${s.i * 0.12}s, stroke-width 0.2s ease, opacity 0.2s ease`,
                      opacity: active !== null && active !== s.i ? 0.28 : 1,
                      cursor:'pointer',
                    }}
                    {...bind(s.i)} />
                ))}

                {/* numbers on the slices — colour is never the only cue */}
                {slices.map(s => (
                  <text key={'n' + s.i} x={s.lx} y={s.ly} textAnchor="middle" dominantBaseline="central"
                    fontFamily="'Plus Jakarta Sans', sans-serif" fontWeight="800"
                    fontSize={s.pct < 15 ? 12.5 : 14} fill={s.ink}
                    style={{pointerEvents:'none',
                      opacity: !donutVisible ? 0 : (active !== null && active !== s.i ? 0.35 : 1),
                      transition:`opacity 0.4s ease ${donutVisible && active === null ? 0.9 + s.i * 0.08 : 0}s`}}>
                    {s.pct}%
                  </text>
                ))}

                {/* centre — the card's title, or whatever you're pointing at */}
                <g style={{pointerEvents:'none'}}>
                  {sel ? (
                    <>
                      <text x={CX} y={CX - 7} textAnchor="middle" dominantBaseline="central"

                      fontFamily="'Plus Jakarta Sans', sans-serif" fontWeight="800" fontSize="19" fill="#292524"

                  )}

              </svg>
            </div>

            {/* Legend — same order as the ring, clockwise from the top */}
            <ul>
              {timeSlices.map((s, i) => (

/* ─── App ─── */
/* mailto: does nothing visible when no mail app is set up, so we also copy the address and confirm it */
function copyEmail(addr) {
  const done = () => {
    let t = document.getElementById('vd-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'vd-toast'; t.setAttribute('role','status');
      t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:2147483000;'+
        'background:#292524;color:#fff;font:600 13px "Plus Jakarta Sans",sans-serif;padding:11px 18px;border-radius:999px;'+
        'box-shadow:0 10px 30px rgba(0,0,0,0.25);opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = 'Email copied: ' + addr;
    requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(12px)'; }, 2600);
  };
  try { navigator.clipboard.writeText(addr).then(done, done); } catch (e) { done(); }
}

function App() {
  useEffect(() => {
    // Disable browser scroll restoration and force top on every load
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  }, []);

  /* ── section_viewed — fires once per section per page load, when the
     section crosses the middle band of the viewport. Using a rootMargin
     band rather than a ratio threshold means it works the same for a
     short section and for one taller than the screen.              ── */
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const seen = new Set();
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting && !seen.has(en.target.id)) {
          seen.add(en.target.id);
          track('section_viewed', { section: en.target.id });
        }
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
    document.querySelectorAll('section[id]').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  /* ── outbound and download clicks, caught by delegation so links inside
     the case study modals are covered too                          ── */
  useEffect(() => {
    const onClick = e => {
      const a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      let name = null;
      if (/\.pdf($|\?)/i.test(href))                      name = 'cv_downloaded';
      else if (href.startsWith('mailto:'))               { name = 'email_clicked'; copyEmail(href.slice(7).split('?')[0]); }
      else if (href.includes('linkedin.com'))              name = 'linkedin_clicked';
      else if (href.includes('calendly.com'))              name = 'calendly_opened';
      else if (href.includes('stridehq.app'))              name = 'stride_visited';
      else if (href.includes('odevo.com'))                 name = 'odevo_clicked';
      else if (/coursera\.org|credly\.com|deeplearning\.ai/.test(href)) name = 'certificate_verified';
      if (name) track(name, { label: (a.innerText || '').trim().slice(0, 60) });
    };
    document.addEventListener('click', onClick, true);
    return () => document.removeEventListener('click', onClick, true);
  }, []);

  return (
    <>
      <Nav />
      <main>
        <Hero />
        <Work />
        <About />
        <Now />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
